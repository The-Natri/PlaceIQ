# Development override: also publishes Postgres, on 127.0.0.1 only, so tools
# running on this machine can reach it: start.ps1 / start.sh (the no-Docker-
# for-the-app fallback), the smoke test and the evidence scripts.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
