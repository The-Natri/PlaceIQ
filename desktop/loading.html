<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>PlaceIQ</title>
  <style>
    :root { --bg: #0f1b3d; --card: #16244d; --text: #e8edf9; --muted: #a9b6d6; --accent: #2a78d6; --error: #f3a39a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .card { width: min(520px, 100%); background: var(--card); border-radius: 14px; padding: 32px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .logo { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 14px;
      background: var(--accent); font-weight: 700; font-size: 20px; margin-bottom: 12px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 3em; color: var(--muted); word-break: break-word; }
    .error #status { color: var(--error); }
    .error .spinner { display: none; }
    .actions { display: none; gap: 8px; justify-content: center; margin-top: 16px; }
    .error .actions { display: flex; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer; }
    #retry { background: var(--accent); color: #fff; }
    #download { background: transparent; color: var(--text); border: 1px solid var(--muted); display: none; }
    .needs-install #download { display: inline-block; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="card" id="card" role="status" aria-live="polite">
      <div class="logo" aria-hidden="true">PI</div>
      <h1>PlaceIQ</h1>
      <p class="sub">College Placement Management System</p>
      <div class="spinner" aria-hidden="true"></div>
      <div id="status">Starting…</div>
      <div class="actions">
        <button id="retry" type="button">Retry</button>
        <button id="download" type="button">Get Docker Desktop</button>
      </div>
    </div>
  </main>
  <script>
    const card = document.getElementById("card");
    window.placeiq.onStatus(({ text, kind }) => {
      document.getElementById("status").textContent = text;
      card.classList.toggle("error", kind.startsWith("error"));
      card.classList.toggle("needs-install", kind === "error-install");
    });
    document.getElementById("retry").addEventListener("click", () => window.placeiq.retry());
    document.getElementById("download").addEventListener("click", () => window.placeiq.openDockerDownload());
  </script>
</body>
</html>
